<style>
:root {
  --fg: #000;
  --bg: #fff;
  --muted: #787168;
  --accent: #0d9488;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  display: flex;
  align-items: center;
}
main { width: 100%; max-width: 1024px; margin: 0 auto; padding: 48px 96px; }
h1 { font-weight: 400; font-size: 72px; line-height: 1.05; letter-spacing: -.015em; margin: 0; }
ul { list-style: none; margin: 40px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px 32px; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 17px; }
a { color: var(--fg); text-decoration: underline dotted; text-decoration-thickness: 1px; text-underline-offset: 4px; }
a:hover { color: var(--accent); }
@media (max-width: 640px) {
  main { padding: 32px 16px; }
  h1 { font-size: 44px; }
  ul { margin-top: 28px; font-size: 16px; gap: 10px 24px; }
}
</style>
